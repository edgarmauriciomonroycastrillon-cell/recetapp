<!doctype html>
<html lang="es-CO">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RecetApp · Compara precios de medicamentos</title>
  <meta name="description" content="Compara precios de medicamentos entre farmacias de Colombia y encuentra la opción más barata con la misma sustancia.">
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <header class="encabezado">
    <h1 class="marca-app">RecetApp</h1>
    <p class="fecha-datos" id="fecha-datos">Cargando precios…</p>
    <form class="buscador" role="search" onsubmit="return false">
      <label for="busqueda" class="buscador-etiqueta">Busca por nombre, marca o principio activo</label>
      <input id="busqueda" type="search" autocomplete="off" spellcheck="false"
             placeholder="Ej.: losartán, Dolex, ibuprofeno" disabled>
    </form>
  </header>

  <main class="contenido">
    <p class="estado" id="estado" aria-live="polite"></p>
    <div id="resultados"></div>
  </main>

  <footer class="aviso" role="note">
    RecetApp compara precios; no reemplaza la indicación de tu médico o farmacéutico
  </footer>

  <script src="app.js"></script>
</body>
</html>
