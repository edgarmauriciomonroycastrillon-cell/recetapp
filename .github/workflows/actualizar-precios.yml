# Actualiza los precios todos los días a las 7:00 a. m. hora Colombia y republica el sitio.
name: Actualizar precios

on:
  schedule:
    - cron: "0 12 * * *" # 12:00 UTC = 7:00 a. m. en Colombia (UTC-5, sin horario de verano)
  workflow_dispatch: # permite correrlo a mano desde la pestaña Actions

permissions:
  contents: write

concurrency:
  group: actualizar-precios
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Consultar las farmacias
        run: python scraper.py

      - name: Unir con los precios anteriores
        run: python unir.py

      - name: Guardar y publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/precios.csv data/scrapeado-hoy.csv data/estado-scraping.json
          if git diff --cached --quiet; then
            echo "Los precios no cambiaron; no hay nada que publicar."
            exit 0
          fi
          git commit -m "Actualiza precios del $(TZ=America/Bogota date +%F)"
          git push
